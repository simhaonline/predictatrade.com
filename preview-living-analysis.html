<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Preview of Predict-A-Trade's Living Analysis hero animation.">
  <title>Living Analysis — Predict-A-Trade</title>
  <link rel="stylesheet" href="/living-analysis.css">
  <style>
    :root { background:#f6f4ef; color:#171714; font-family:Manrope,Arial,sans-serif; }
    body { margin:0; padding:clamp(24px,7vw,96px); }
    main { margin:auto; max-width:1100px; }
    .kicker { color:#a74824; font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { font:700 clamp(38px,7vw,76px)/.98 Georgia,serif; letter-spacing:-.06em; margin:14px 0; max-width:720px; }
    p { color:#68665e; line-height:1.6; max-width:650px; }
    [data-living-analysis] { margin-top:42px; }
    .back { color:#171714; display:inline-block; font-weight:800; margin-top:28px; }
  </style>
</head>
<body>
  <main>
    <div class="kicker">Predict-A-Trade / component preview</div>
    <h1>The Living Analysis.</h1>
    <p>A calm, deterministic illustration of Observe → Contextualise → Act. It is not a live ticker, signal feed, or trading widget.</p>
    <div data-living-analysis>
      <img src="/media/pat-hero-signal.webp" alt="Abstract rising market signal">
    </div>
    <a class="back" href="/">← Back to Predict-A-Trade</a>
  </main>
  <script src="/living-analysis.js" defer></script>

</html>
